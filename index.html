    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
